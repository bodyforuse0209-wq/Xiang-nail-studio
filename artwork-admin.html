
<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>香香村｜作品管理後台</title>
<script src="./firebase-config.js"></script>
<style>
:root{
  --bg:#f7f5f1;
  --paper:#fff;
  --ink:#292725;
  --muted:#817c75;
  --line:#e8e1d8;
  --gold:#a58c6a
}
*{box-sizing:border-box}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,
  "Microsoft JhengHei",sans-serif
}
main{max-width:850px;margin:auto;padding:24px 16px 80px}
header{text-align:center;margin:24px 0 30px}
.brand{color:var(--gold);font-size:12px;letter-spacing:3px}
h1{font-size:27px;margin:12px 0}
h2{font-size:19px}
p,.hint{color:var(--muted);line-height:1.7}
.panel{
  background:var(--paper);
  border:1px solid var(--line);
  border-radius:18px;
  padding:22px;
  margin-bottom:18px
}
label{display:block;margin:14px 0 5px;font-size:14px}
input,select,textarea{
  display:block;
  width:100%;
  padding:12px;
  border:1px solid var(--line);
  border-radius:10px;
  font:inherit;
  background:#fff
}
textarea{resize:vertical}
button{
  font:inherit;
  padding:11px 15px;
  border-radius:10px;
  border:1px solid var(--line);
  background:#fff;
  cursor:pointer
}
button:disabled{opacity:.55;cursor:wait}
.primary{background:var(--ink);color:#fff}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1;min-width:130px}
.grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:12px
}
.item{
  border:1px solid var(--line);
  border-radius:14px;
  padding:15px;
  background:#fff;
  min-width:0
}
.item strong{display:block;margin-bottom:8px}
.meta{font-size:12px;color:var(--muted);line-height:1.8}
.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}
.actions button{font-size:13px}
.badge{
  display:inline-block;
  border-radius:30px;
  background:#f1ede6;
  padding:5px 10px;
  font-size:12px;
  margin-bottom:10px
}
.hidden{display:none!important}
.status{
  padding:12px;
  border-radius:10px;
  background:#f1ede6;
  margin-bottom:18px;
  white-space:pre-wrap
}
.error{background:#fbe9e7;color:#8d2c20}
.success{background:#eaf4eb;color:#205b2b}
.photo-preview{
  display:none;
  max-width:100%;
  max-height:320px;
  object-fit:contain;
  border-radius:12px;
  margin-top:12px
}
.item-photo{
  width:100%;
  aspect-ratio:4/3;
  object-fit:cover;
  border-radius:10px;
  margin-bottom:12px;
  background:var(--bg)
}
.upload-box{
  padding:16px;
  border:1px dashed var(--gold);
  border-radius:14px;
  margin-top:18px;
  background:#fcfaf7
}
.fixed-price{
  background:#f8f3eb;
  border:1px solid #dfcfb9;
  border-radius:14px;
  padding:16px;
  margin-top:18px
}
.price{
  font-size:18px;
  color:#8c704d;
  font-weight:700;
  margin:8px 0
}
.ai-panel{border-color:var(--gold);background:#fcfaf7}
a{color:#78603f}
#toast{
  position:fixed;
  left:16px;
  right:16px;
  bottom:25px;
  z-index:9999;
  background:#292725;
  color:white;
  border-radius:14px;
  padding:17px;
  box-shadow:0 8px 30px #0003;
  white-space:pre-wrap;
  display:none
}
#toast.show{display:block}
#toast.error{background:#872d25}
#toast.success{background:#28623c}
@media(max-width:560px){
  .grid{grid-template-columns:1fr}
  .row{display:block}
  .row>*{margin-bottom:8px}
}
</style>
</head>

<body>
<div id="toast" role="alert"></div>

<main>
<header>
  <div class="brand">XIANG BEAUTY STUDIO</div>
  <h1>作品管理後台</h1>
  <p>作品固定售價｜整套完成價</p>
</header>

<div id="message" class="status" role="status">
  正在連線 Firebase…
</div>

<section id="loginPanel" class="panel hidden">
  <h2>村長登入</h2>
  <form id="loginForm">
    <label for="loginEmail">電子郵件</label>
    <input id="loginEmail" type="email" required
      autocomplete="username">

    <label for="loginPassword">密碼</label>
    <input id="loginPassword" type="password" required
      autocomplete="current-password">

    <button class="primary" type="submit"
      style="margin-top:16px">登入</button>
  </form>
</section>

<section id="adminPanel" class="hidden">

  <section class="panel">
    <div class="row">
      <p id="ownerName">已登入</p>
      <button id="logoutBtn" type="button">登出</button>
    </div>
  </section>

  <section class="panel">
    <h2 id="formTitle">新增美甲作品</h2>
    <p class="hint">
      作品固定售價包含基礎凝膠與所有造型。
      此價格由村長手動設定，不由 AI 修改。
    </p>

    <form id="artForm">

      <label for="name">作品名稱</label>
      <input id="name" required maxlength="80"
        placeholder="例如：精靈狗">

      <div class="row">
        <div>
          <label for="gender">作品類別</label>
          <select id="gender">
            <option value="men">男士美甲</option>
            <option value="women">女士美甲</option>
            <option value="unisex">中性／不限性別</option>
          </select>
        </div>

        <div>
          <label for="style">風格分類</label>
          <select id="style">
            <option value="clean">極簡日常</option>
            <option value="graphic">潮流圖騰</option>
            <option value="metal">暗黑金屬</option>
            <option value="fandom">應援甲</option>
          </select>
        </div>
      </div>

      <div class="upload-box">
        <label for="artworkPhoto">美甲作品照片</label>
        <input id="artworkPhoto" type="file"
          accept="image/jpeg,image/png,image/webp">

        <p class="hint">
          JPG、PNG、WebP，最多 8 MB。
        </p>

        <button type="button" id="uploadPhotoBtn">
          上傳照片至 Cloudinary
        </button>

        <p id="uploadPhotoStatus" class="hint">
          尚未選擇照片
        </p>

        <img id="artworkPhotoPreview"
          class="photo-preview" alt="作品預覽">
      </div>

      <div class="fixed-price">
        <h2>作品固定售價</h2>

        <p class="hint">
          這是整套完成價，包含底款與所有造型。
          留空表示尚未定價。
        </p>

        <label for="fixedPrice">整套固定售價（NT$）</label>
        <input id="fixedPrice"
          type="number"
          min="0"
          max="1000000"
          step="1"
          inputmode="numeric"
          placeholder="例如：1800">

        <label for="showPrice">價格顯示設定</label>
        <select id="showPrice">
          <option value="yes">公開顯示作品售價</option>
          <option value="no">只供村長內部參考</option>
        </select>

        <label for="priceNote">售價備註</label>
        <textarea id="priceNote" rows="2" maxlength="300"
          placeholder="例如：整套完成價"></textarea>
      </div>

      <label for="tags">搜尋標籤（逗號分隔）</label>
      <input id="tags" placeholder="銀色, 鏡面, 金屬">

      <label for="notes">作品備註</label>
      <textarea id="notes" rows="3" maxlength="2000"></textarea>

      <label for="status">上架狀態</label>
      <select id="status">
        <option value="draft">草稿</option>
        <option value="published">公開上架</option>
        <option value="archived">封存</option>
      </select>

      <div class="row" style="margin-top:20px">
        <button class="primary" type="submit" id="saveBtn">
          儲存至 Firebase
        </button>

        <button type="button" id="resetBtn">
          清空表單
        </button>
      </div>
    </form>
  </section>

  <section class="panel ai-panel">
    <h2>AI 人工修正工作台</h2>
    <p class="hint">
      店主作品售價由村長設定。
      客人的參考圖片將由另一個估價流程處理。
    </p>
    <a href="./ai-review.html">開啟 AI 工作台</a>
  </section>

  <section class="panel">
    <h2>雲端作品清單</h2>

    <div class="row">
      <input id="search" placeholder="搜尋作品名稱或標籤">

      <select id="filterStatus">
        <option value="all">全部狀態</option>
        <option value="draft">草稿</option>
        <option value="published">公開上架</option>
        <option value="archived">封存</option>
      </select>
    </div>

    <p id="count" class="hint"></p>
    <div id="artList" class="grid"></div>
  </section>
</section>
</main>

<script type="module">
import {
  initializeApp,getApps,getApp
} from 'https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js';

import {
  getAuth,onAuthStateChanged,
  signInWithEmailAndPassword,signOut
} from 'https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js';

import {
getFirestore,collection,doc,getDoc,getDocFromServer,onSnapshot,
  addDoc,updateDoc,deleteDoc,serverTimestamp
} from 'https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js';

const $=id=>document.getElementById(id);

const styleNames={
  clean:'極簡日常',
  graphic:'潮流圖騰',
  metal:'暗黑金屬',
  fandom:'應援甲'
};

const genderNames={
  men:'男士美甲',
  women:'女士美甲',
  unisex:'中性／不限性別'
};

const statusNames={
  draft:'草稿',
  published:'公開上架',
  archived:'封存'
};

let auth,db,unsubscribe=null;
let artworks=[];
let editingId=null;
let isOwner=false;
let uploadedImageUrl='';
let uploading=false;
let saving=false;
let toastTimer=null;

function notify(text,type=''){
  const box=$('toast');
  box.textContent=text;
  box.className='show '+type;

  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>{
    box.className='';
  },6500);
}

function message(text,type='',popup=false){
  $('message').textContent=text;
  $('message').className='status '+type;

  if(popup){
    notify(text,type);
    alert(text);
  }
}

function errorText(e){
  const code=e?.code||'';

  if(code.includes('permission-denied')){
    return 'Firebase 權限不足（permission-denied）。\n'
      +'請檢查 Firestore 安全規則是否允許店主修改作品。';
  }

  if(code.includes('unauthenticated')){
    return '登入已失效，請重新登入。';
  }

  if(code.includes('invalid-credential')){
    return '帳號或密碼不正確。';
  }

  return `${code?code+'：':''}${e?.message||String(e)}`;
}

function showAdmin(yes){
  isOwner=yes;
  $('adminPanel').classList.toggle('hidden',!yes);
  $('loginPanel').classList.toggle('hidden',yes);
}

function showPreview(url){
  const img=$('artworkPhotoPreview');
  img.removeAttribute('src');
  img.style.display='none';

  if(url&&/^https:\/\//.test(url)){
    img.src=url;
    img.style.display='block';
  }
}

function resetForm(){
  editingId=null;
  uploadedImageUrl='';
  $('artForm').reset();
  $('fixedPrice').value='';
  $('showPrice').value='yes';
  $('formTitle').textContent='新增美甲作品';
  $('saveBtn').textContent='儲存至 Firebase';
  $('uploadPhotoStatus').textContent='尚未選擇照片';
  showPreview('');
}

function action(label,callback){
  const button=document.createElement('button');
  button.type='button';
  button.textContent=label;
  button.addEventListener('click',callback);
  return button;
}

function render(){
  const q=$('search').value.trim().toLowerCase();
  const status=$('filterStatus').value;

  const items=artworks.filter(x=>
    (status==='all'||x.status===status)&&
    [
      x.name,
      ...(Array.isArray(x.tags)?x.tags:[]),
      x.notes
    ].join(' ').toLowerCase().includes(q)
  );

  $('count').textContent=
    `雲端共 ${artworks.length} 筆，顯示 ${items.length} 筆`;

  $('artList').replaceChildren();

  if(!items.length){
    const p=document.createElement('p');
    p.className='hint';
    p.textContent='沒有符合條件的作品。';
    $('artList').append(p);
    return;
  }

  items.forEach(x=>{
    const card=document.createElement('article');
    card.className='item';

    if(x.imageUrl&&/^https:\/\//.test(x.imageUrl)){
      const img=document.createElement('img');
      img.className='item-photo';
      img.src=x.imageUrl;
      img.alt=x.name||'美甲作品';
      img.loading='lazy';
      card.append(img);
    }

    const badge=document.createElement('span');
    badge.className='badge';
    badge.textContent=statusNames[x.status]||'草稿';

    const name=document.createElement('strong');
    name.textContent=x.name||'未命名';

    const price=document.createElement('div');
    price.className='price';

    price.textContent=
      Number.isFinite(x.fixedPrice)&&x.fixedPrice>=0
      ?'整套完成價 NT$ '+
       x.fixedPrice.toLocaleString('zh-TW')+
       (x.showPrice===false?'（未公開）':'')
      :'尚未設定固定售價';

    const meta=document.createElement('div');
    meta.className='meta';
    meta.textContent=[
      genderNames[x.gender],
      styleNames[x.style],
      (x.tags||[]).join('、')
    ].filter(Boolean).join(' · ');

    const buttons=document.createElement('div');
    buttons.className='actions';

    buttons.append(
      action('編輯',()=>editItem(x.id)),
      action(
        x.status==='published'?'下架':'上架',
        ()=>changeStatus(
          x.id,
          x.status==='published'?'archived':'published'
        )
      ),
      action('刪除',()=>removeItem(x.id))
    );

    card.append(badge,name,price,meta,buttons);
    $('artList').append(card);
  });
}

function editItem(id){
  const x=artworks.find(a=>a.id===id);
  if(!x)return;

  editingId=id;
  uploadedImageUrl=x.imageUrl||'';

  $('name').value=x.name||'';
  $('gender').value=x.gender||'men';
  $('style').value=x.style||'clean';
  $('tags').value=(x.tags||[]).join(', ');
  $('notes').value=x.notes||'';
  $('status').value=x.status||'draft';

  $('fixedPrice').value=
    Number.isFinite(x.fixedPrice)
    ?String(x.fixedPrice)
    :'';

  $('showPrice').value=
    x.showPrice===false?'no':'yes';

  $('priceNote').value=x.priceNote||'';
  $('artworkPhoto').value='';

  $('formTitle').textContent='編輯作品';
  $('saveBtn').textContent='更新雲端作品';

  showPreview(uploadedImageUrl);

  $('uploadPhotoStatus').textContent=
    uploadedImageUrl
    ?'目前使用原有照片，可選擇新照片替換。'
    :'這筆作品尚無照片。';

  window.scrollTo({top:0,behavior:'smooth'});
}

async function changeStatus(id,status){
  try{
    await updateDoc(
      doc(db,'artworks',id),
      {status,updatedAt:serverTimestamp()}
    );

    message('作品狀態已更新','success',true);
  }catch(e){
    message('更新失敗：'+errorText(e),'error',true);
  }
}

async function removeItem(id){
  const x=artworks.find(a=>a.id===id);

  if(!x||!confirm(
    `確定刪除「${x.name}」？Cloudinary 圖片不會自動刪除。`
  ))return;

  try{
    await deleteDoc(doc(db,'artworks',id));

    if(editingId===id)resetForm();

    message('作品已刪除','success',true);
  }catch(e){
    message('刪除失敗：'+errorText(e),'error',true);
  }
}

$('uploadPhotoBtn').addEventListener('click',async()=>{
  if(!isOwner||uploading||saving)return;

  const file=$('artworkPhoto').files?.[0];

  if(!file){
    message('請先選擇照片','error',true);
    return;
  }

  if(![
    'image/jpeg',
    'image/png',
    'image/webp'
  ].includes(file.type)){
    message('請使用 JPG、PNG 或 WebP','error',true);
    return;
  }

  if(file.size>8*1024*1024){
    message('圖片不得超過 8 MB','error',true);
    return;
  }

  uploading=true;
  $('uploadPhotoBtn').disabled=true;
  $('saveBtn').disabled=true;
  $('uploadPhotoStatus').textContent='正在上傳照片…';

  try{
    const token=await auth.currentUser.getIdToken();

    const signResponse=await fetch(
      '/api/cloudinary-sign',
      {
        method:'POST',
        headers:{
          'Content-Type':'application/json',
          Authorization:'Bearer '+token
        }
      }
    );

    const sign=await signResponse.json();

    if(!signResponse.ok){
      throw Error(sign.error||'取得上傳簽章失敗');
    }

    const form=new FormData();
    form.append('file',file);
    form.append('api_key',sign.apiKey);
    form.append('timestamp',String(sign.timestamp));
    form.append('signature',sign.signature);
    form.append('folder',sign.folder);
    form.append('overwrite',String(sign.overwrite));

    const response=await fetch(
      `https://api.cloudinary.com/v1_1/${
        encodeURIComponent(sign.cloudName)
      }/image/upload`,
      {method:'POST',body:form}
    );

    const uploaded=await response.json();

    if(!response.ok||!uploaded.secure_url){
      throw Error(
        uploaded.error?.message||'照片上傳失敗'
      );
    }

    uploadedImageUrl=uploaded.secure_url;
    $('artworkPhoto').value='';
    showPreview(uploadedImageUrl);

    $('uploadPhotoStatus').textContent=
      '照片上傳成功，可以儲存作品。';

    message('照片上傳成功','success',true);

  }catch(e){
    $('uploadPhotoStatus').textContent=
      '上傳失敗：'+errorText(e);

    message('上傳失敗：'+errorText(e),'error',true);

  }finally{
    uploading=false;
    $('uploadPhotoBtn').disabled=false;
    $('saveBtn').disabled=false;
  }
});

$('artForm').addEventListener('submit',async e=>{
  e.preventDefault();

  if(!isOwner||uploading||saving)return;

  if($('artworkPhoto').files?.length){
    message(
      '你選了新照片，但尚未上傳。請先上傳照片。',
      'error',true
    );
    return;
  }

  const tags=$('tags').value
    .split(/[,，]/)
    .map(x=>x.trim())
    .filter(Boolean);

  if(tags.length>20||tags.some(t=>t.length>100)){
    message('標籤最多 20 個，單個不超過 100 字','error',true);
    return;
  }

  const input=$('fixedPrice').value.trim();
  const fixedPrice=input===''?null:Number(input);

  if(
    input!==''&&(
      !Number.isSafeInteger(fixedPrice)||
      fixedPrice<0||
      fixedPrice>1000000
    )
  ){
    message(
      '固定售價請輸入 0 至 1,000,000 的整數。',
      'error',true
    );
    return;
  }

  const data={
    name:$('name').value.trim(),
    gender:$('gender').value,
    style:$('style').value,
    tags,
    notes:$('notes').value.trim(),
    status:$('status').value,
    imageUrl:uploadedImageUrl,
    fixedPrice,
    priceType:'complete_set',
    priceIncludesBase:true,
    showPrice:$('showPrice').value==='yes',
    priceNote:$('priceNote').value.trim(),
    updatedAt:serverTimestamp()
  };

  if(!data.name){
    message('請輸入作品名稱','error',true);
    return;
  }

  saving=true;
  const button=$('saveBtn');
  button.disabled=true;
  button.textContent='正在儲存並驗證…';

  const currentId=editingId;

  try{
    let savedId=currentId;

    if(currentId){
      await updateDoc(
        doc(db,'artworks',currentId),
        data
      );
    }else{
      const result=await addDoc(
        collection(db,'artworks'),
        {...data,createdAt:serverTimestamp()}
      );
      savedId=result.id;
    }

    // 強制從 Firebase 伺服器重新讀取，
    // 避免只看到本機快取就誤認儲存成功。
    const verified=await getDocFromServer(
      doc(db,'artworks',savedId)
    );

    if(!verified.exists()){
      throw Error('儲存後找不到作品文件');
    }

    const actual=verified.data();

    if(
      actual.fixedPrice!==fixedPrice||
      actual.priceType!=='complete_set'||
      actual.showPrice!==data.showPrice
    ){
      throw Error(
        'Firebase 資料與輸入不一致。'
        +'預期價格：'+fixedPrice+
        '；實際價格：'+actual.fixedPrice
      );
    }

    resetForm();

    message(
      '儲存成功！\n'
      +'已重新從 Firebase 伺服器驗證。\n'
      +'作品：'+actual.name+'\n'
      +'整套固定售價：'+(
        actual.fixedPrice===null
        ?'尚未定價'
        :'NT$ '+actual.fixedPrice.toLocaleString('zh-TW')
      ),
      'success',true
    );

  }catch(err){
    message(
      '儲存或驗證失敗：\n'+errorText(err),
      'error',true
    );
  }finally{
    saving=false;
    button.disabled=false;
    button.textContent=editingId
      ?'更新雲端作品'
      :'儲存至 Firebase';
  }
});

$('resetBtn').addEventListener('click',()=>{
  if(!saving&&!uploading)resetForm();
});

$('search').addEventListener('input',render);
$('filterStatus').addEventListener('change',render);

$('loginForm').addEventListener('submit',async e=>{
  e.preventDefault();

  try{
    await signInWithEmailAndPassword(
      auth,
      $('loginEmail').value.trim(),
      $('loginPassword').value
    );
  }catch(err){
    message(errorText(err),'error',true);
  }
});

$('logoutBtn').addEventListener('click',()=>signOut(auth));

try{
  const config=window.XIANG_FIREBASE_CONFIG;
  const ownerUid=window.XIANG_OWNER_UID;

  if(!config||!ownerUid){
    throw Error('Firebase 設定未載入');
  }

  const app=getApps().length
    ?getApp()
    :initializeApp(config);

  auth=getAuth(app);
  db=getFirestore(app);

  onAuthStateChanged(auth,async user=>{
    if(unsubscribe){
      unsubscribe();
      unsubscribe=null;
    }

    showAdmin(false);

    if(!user){
      message('請使用村長帳號登入');
      return;
    }

    try{
      if(user.uid!==ownerUid){
        throw Error('不是授權店主帳號');
      }

      const staff=await getDoc(
        doc(db,'staff',user.uid)
      );

      if(
        !staff.exists()||
        staff.data().role!=='owner'||
        staff.data().active!==true
      ){
        throw Error('店主權限未啟用');
      }

      showAdmin(true);

      $('ownerName').textContent=
        '村長已登入：'+(user.email||'');

      unsubscribe=onSnapshot(
        collection(db,'artworks'),
        snapshot=>{
          artworks=snapshot.docs.map(d=>({
            id:d.id,...d.data()
          }));

          artworks.sort((a,b)=>
            String(a.name||'').localeCompare(
              String(b.name||''),'zh-Hant'
            )
          );

          render();
          message('作品清單已同步','success');
        },
        err=>message(errorText(err),'error',true)
      );

    }catch(err){
      showAdmin(false);
      message(errorText(err),'error',true);
    }
  });

}catch(err){
  message(errorText(err),'error',true);
}
</script>
