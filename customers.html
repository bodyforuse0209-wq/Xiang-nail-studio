<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>香香村 V11｜客戶管理</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;color:#352f2a;background:#f9f7f3}*{box-sizing:border-box}body{margin:0}header{background:#eee5d9;padding:24px 18px;border-bottom:1px solid #d9c9b5}main{max-width:700px;margin:auto;padding:18px}h1{font-size:23px;margin:5px 0}h2{font-size:18px;margin:0 0 12px}small,.muted{color:#766f68}.card{background:white;border:1px solid #e7ded3;border-radius:16px;padding:18px;margin-bottom:16px;box-shadow:0 3px 12px #382a1708}label{display:block;font-size:13px;margin:12px 0 4px}input,textarea{width:100%;padding:12px;border:1px solid #d8cabc;border-radius:9px;font:inherit;background:#fff;color:#352f2a}button{border:0;border-radius:10px;padding:12px 15px;background:#453b34;color:white;font:inherit;cursor:pointer}button.secondary{background:#eee5d9;color:#352f2a}button:disabled{opacity:.45}.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}.item{width:100%;display:block;text-align:left;background:#f8f5f0;color:#352f2a;margin:8px 0;padding:13px}.tag{font-size:12px;background:#eee5d9;padding:4px 8px;border-radius:20px}.hidden{display:none!important}#message{white-space:pre-wrap;margin:12px 0;color:#775d38}a{color:#67513d}#saveBtn{width:100%;margin-top:15px}
</style></head><body>
<header><small>XIANG BEAUTY STUDIO · V11.0</small><h1>香香村｜客戶管理</h1><a href="./index.html">← 回原本美甲系統</a></header>
<main><p id="message">正在確認登入狀態…</p>
<section class="card" id="authBox"><h2>員工登入</h2><label>電子郵件</label><input id="email" type="email" autocomplete="username"><label>密碼</label><input id="password" type="password" autocomplete="current-password"><button id="loginBtn" style="margin-top:12px">登入</button></section>
<div id="workspace" class="hidden"><section class="card"><div class="row" style="align-items:center"><h2 style="flex:3">客戶名單</h2><button id="newBtn">＋ 新增客戶</button></div><input id="search" placeholder="搜尋姓名、電話、LINE 暱稱"><div id="list"></div></section>
<section class="card hidden" id="editor"><h2 id="formTitle">新增常客</h2><form id="form"><input type="hidden" id="cid"><label>姓名／稱呼 *</label><input id="name" required maxlength="80"><label>電話（選填）</label><input id="phone" type="tel" maxlength="30"><label>LINE 暱稱（選填）</label><input id="line" maxlength="80"><label>生日（選填）</label><input id="birthday" type="date"><label>偏好與服務備註（選填）</label><textarea id="notes" rows="3" maxlength="1500"></textarea><p class="muted">會員建檔不代表儲值。正式儲值錢包尚未啟用。</p><button id="saveBtn" type="submit">儲存客戶資料</button><button type="button" class="secondary" id="cancelBtn" style="width:100%;margin-top:8px">取消</button></form></section></div>
</main><script src="./firebase-config.js"></script><script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js';
import{getAuth,onAuthStateChanged,signInWithEmailAndPassword}from'https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js';
import{getFirestore,collection,doc,getDoc,getDocs,query,orderBy,addDoc,updateDoc,serverTimestamp}from'https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js';
const $=id=>document.getElementById(id),db=getFirestore(initializeApp(window.XIANG_FIREBASE_CONFIG)),auth=getAuth();
let current=null,customers=[];const msg=s=>$('message').textContent=s;
function clean(s){return String(s||'').trim()}
function showForm(c){$('editor').classList.remove('hidden');$('formTitle').textContent=c?'編輯客戶':'新增常客';$('cid').value=c?.id||'';for(const key of ['name','phone','line','birthday','notes'])$(key).value=c?.[key]||'';$('editor').scrollIntoView({behavior:'smooth'});}
function render(){const term=clean($('search').value).toLowerCase();const matched=customers.filter(c=>[c.name,c.phone,c.line].some(x=>String(x||'').toLowerCase().includes(term)));$('list').replaceChildren();if(!matched.length){const p=document.createElement('p');p.className='muted';p.textContent='目前沒有符合的客戶';$('list').append(p)}for(const c of matched){const b=document.createElement('button');b.className='item';b.textContent=`${c.name}　${c.phone||''}　｜常客`;b.onclick=()=>showForm(c);$('list').append(b)}}
async function load(){const snap=await getDocs(query(collection(db,'customers'),orderBy('name')));customers=snap.docs.map(d=>({id:d.id,...d.data()}));render();msg(`已登入，客戶共 ${customers.length} 位`)}
onAuthStateChanged(auth,async u=>{current=null;$('workspace').classList.add('hidden');$('authBox').classList.remove('hidden');if(!u){msg('請使用香香村員工帳號登入');return}try{const staff=await getDoc(doc(db,'staff',u.uid));if(!staff.exists()||staff.data().active!==true)throw Error('此帳號尚未開通員工權限');current=u;$('authBox').classList.add('hidden');$('workspace').classList.remove('hidden');await load()}catch(e){msg('無法開啟客戶資料：'+e.message)}});
$('loginBtn').onclick=async()=>{try{await signInWithEmailAndPassword(auth,clean($('email').value),$('password').value)}catch(e){msg('登入失敗：'+e.message)}};
$('newBtn').onclick=()=>showForm(null);$('cancelBtn').onclick=()=>$('editor').classList.add('hidden');$('search').oninput=render;
$('form').onsubmit=async e=>{e.preventDefault();if(!current)return msg('請先登入');const data={};for(const k of ['name','phone','line','birthday','notes'])data[k]=clean($(k).value);if(!data.name)return msg('請填寫姓名');const id=$('cid').value;$('saveBtn').disabled=true;try{if(id){await updateDoc(doc(db,'customers',id),{...data,updatedAt:serverTimestamp(),updatedBy:current.uid})}else{await addDoc(collection(db,'customers'),{...data,createdAt:serverTimestamp(),createdBy:current.uid,updatedAt:serverTimestamp(),updatedBy:current.uid})}$('editor').classList.add('hidden');await load();msg('客戶資料已儲存至雲端')}catch(err){msg('儲存失敗：'+err.message)}finally{$('saveBtn').disabled=false}};
</script></body></html>
