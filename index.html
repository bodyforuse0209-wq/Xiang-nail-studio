
<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>香香村美妍製造所｜男女美甲智慧估價</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;color:#edf1f5;background:#0b0d10;font-size:14px}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at 90% 0%,#2c3642,transparent 410px),#0b0d10;min-height:100vh}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
button:disabled{opacity:.35;cursor:default}
.wrap{max-width:1040px;margin:auto;padding:20px 14px 120px}
.brand{font-family:Georgia,serif;letter-spacing:2px;font-size:28px}
.micro{color:#99a6b5;font-size:11px;line-height:1.7}
.eyebrow{color:#a5b5c5;font-size:10px;letter-spacing:2px}
.tabs,.switch{display:flex;gap:8px;margin:18px 0}
.tabs button,.switch button{flex:1;border:1px solid #4b5968;background:#1d2630;color:#dce5ed;border-radius:11px;padding:13px 9px;font-weight:650}
.tabs button.on,.switch button.on{background:#dce5ef;color:#15202b;border-color:#fff}
.switch button{font-size:17px;padding:22px 10px}
.switch button small{display:block;font-size:10px;font-weight:400;margin-top:7px}
.card{background:linear-gradient(140deg,#192029,#11161b);border:1px solid #394553;border-radius:16px;padding:18px;margin:13px 0;box-shadow:0 8px 26px #0003}
.card h2{font-size:15px;margin:0 0 14px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.btnsel{color:#ecf2f7;border:1px solid #536272;background:#222c37;padding:13px;border-radius:10px;text-align:left;min-height:68px}
.btnsel.on{background:linear-gradient(130deg,#526171,#25313d);border-color:#e9f0f5}
.btnsel small{display:block;color:#b5c4d1;margin-top:8px}
.group{border:1px solid #3d4b58;border-radius:10px;margin:9px 0;overflow:hidden;background:#10161c}
.group summary{cursor:pointer;padding:15px;font-weight:650}
.item{display:flex;justify-content:space-between;gap:10px;align-items:center;border-top:1px solid #303a45;padding:12px}
.itemtext{flex:1;min-width:0}
.itemname{font-weight:600}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.count{display:flex;align-items:center;border:1px solid #657487;border-radius:8px;overflow:hidden;flex-shrink:0}
.count button{width:34px;height:36px;background:#2a3745;border:0;color:white;font-size:19px}
.count span{min-width:30px;text-align:center;font-weight:700}
.edit{color:#bed2e4;background:transparent;border:0;text-decoration:underline;text-decoration-style:dotted;font-size:11px;margin:5px 0 0;padding:3px 0}
.field{width:100%;min-width:0;background:#0d141b;border:1px solid #50606f;color:white;border-radius:9px;padding:12px;margin-top:7px;min-height:43px}
label{display:block;color:#b8c6d5;font-size:12px;margin:12px 0}
.twocol{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 12px}
.wide{grid-column:1/-1}
.action{border-radius:10px;background:#dce6ee;color:#131a21;border:0;padding:12px 15px;font-weight:750}
.alt{background:#263340;color:#e5edf5;border:1px solid #697c8c}
.danger{background:#4a282b;color:#f9e5e5;border:1px solid #8f5a60}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.sum{position:sticky;bottom:0;background:#1c2935f5;border:1px solid #738394;box-shadow:0 -14px 40px #0008;border-radius:13px;padding:15px;z-index:3}
.total{font-size:29px;font-weight:750}
.note{color:#dbbfa0;font-size:11px;line-height:1.8}
.muted{color:#acbbc9;font-size:11px}
.line{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid #3c4651}
.line span:first-child{flex:1}
.line b{white-space:nowrap}
.pill{font-size:10px;border:1px solid #607185;border-radius:99px;padding:3px 8px;color:#c6d4e2}
.receipt{background:#edf0f3;color:#202832;border-radius:10px;padding:18px;margin:13px 0}
.receipt .line{border-color:#c5cdd5}
.statgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}
.stat{border:1px solid #526171;border-radius:10px;padding:12px;background:#1d2a36}
.stat strong{display:block;font-size:19px;margin-top:9px;overflow-wrap:anywhere}
.reportrow{padding:14px 0;border-bottom:1px solid #43515f}
.hidden{display:none!important}
.overlay{position:fixed;inset:0;background:#000c;display:grid;place-items:center;padding:13px;z-index:10}
.dialog{background:#171f28;border:1px solid #768594;border-radius:16px;padding:19px;width:min(510px,100%);max-height:88vh;overflow:auto}
.fingers{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.fingers button{border:1px solid #657788;background:#263543;color:white;border-radius:8px;padding:12px 2px;font-size:11px}
.fingers button.on{background:#dce7f0;color:#19232d}
.women .card{border-color:#69594c;background:linear-gradient(135deg,#29231e,#171717)}
.women .btnsel.on,.women .switch button.on{border-color:#e8d7be;background:linear-gradient(130deg,#776652,#3c3229);color:#fff}
.women .action:not(.alt):not(.danger){background:#e8d8c1;color:#29231d}
@media(max-width:520px){
.wrap{padding:15px 11px 100px}
.twocol{grid-template-columns:1fr}
.wide{grid-column:auto}
.brand{font-size:23px}
.card{padding:14px}
.stat{padding:9px}
.stat strong{font-size:15px}
.count button{width:29px}
.count span{min-width:25px}
.sum .actions button{padding:11px 8px;font-size:11px}
}
@media print{
body{background:white;color:black}
.wrap,.overlay{display:none!important}
#print{display:block!important;color:black;padding:20px;font:14px Arial,sans-serif}
#print .line{border-color:#aaa}
}
</style>
</head>
<body>
<div class="wrap" id="app">
<div class="eyebrow">XIANG BEAUTY STUDIO</div>
<div class="brand">XIANG NAIL ATELIER</div>
<div class="micro">香香村美妍製造所｜智慧計價・施作回報・業績管理</div>

<nav class="tabs">
<button data-page="quote" class="on">01 估價</button>
<button data-page="report">02 美甲師回報</button>
<button data-page="history">03 業績紀錄</button>
</nav>

<section id="quotePage">
<div class="switch">
<button id="menBtn" class="on" data-gender="men">男士美甲<small>MEN'S NAIL LAB</small></button>
<button id="womenBtn" data-gender="women">女士美甲<small>WOMEN'S NAIL ATELIER</small></button>
</div>

<div id="styleCard" class="card">
<h2>01　選擇男士風格</h2>
<div id="styles" class="grid"></div>
<p class="micro">風格附加費自動合併於基礎價格，不會獨立列在客人明細。</p>
</div>

<div class="card">
<h2>02　基礎服務</h2>
<div id="bases" class="grid"></div>
<p class="note" id="baseNote"></p>
</div>

<div class="card">
<h2>03　造型自由加購</h2>
<p id="reclabel" class="micro">依選擇風格智慧推薦，任意指數可點選＋／－。</p>
<div class="actions" id="recs"></div>
<div id="addons"></div>
</div>

<div class="card">
<h2>04　卸甲與其他項目</h2>
<div id="removalChoices" class="grid"></div>
<div id="extras"></div>
</div>

<div class="card">
<h2>05　結帳調整</h2>
<div class="twocol">
<label>優惠折讓（扣款金額）
<input class="field" id="discount" type="number" min="0" step="1" inputmode="decimal" placeholder="0">
</label>
<label>其他加收（選填）
<input class="field" id="extraCharge" type="number" min="0" step="1" inputmode="decimal" placeholder="0">
</label>
<label class="wide">指定成交總價（選填；輸入後優先採用）
<input class="field" id="fixedTotal" type="number" min="0" step="1" inputmode="decimal" placeholder="留空依系統計價">
</label>
</div>
<div class="micro" id="adjustInfo"></div>
</div>

<div class="card">
<h2>06　客戶與施工備註</h2>
<label>客戶稱呼
<input id="customer" class="field" placeholder="選填">
</label>
<label>施作設計備註
<textarea id="quoteNote" class="field" rows="2" placeholder="例如：右拇指 Logo／特殊指定"></textarea>
</label>
<button class="action alt" id="clearQuote">重新估價</button>
</div>

<div class="sum">
<div class="row">
<div>
<div class="micro">目前預估總金額 NT$</div>
<div class="total" id="total">800</div>
</div>
<div class="actions">
<button class="action alt" id="preview">客人明細</button>
<button class="action" id="transfer">帶入回報 →</button>
</div>
</div>
</div>
</section>

<section id="reportPage" class="hidden">
<div class="card">
<h2>美甲師營業回報</h2>
<p class="micro">從估價帶入後，可按現場實際成交金額修改。</p>
<button class="action alt" id="import">帶入目前估價</button>

<form id="reportForm">
<div class="twocol">
<label>日期 *
<input id="date" type="date" class="field" required>
</label>
<label>美甲師 *
<input id="artist" class="field" required>
</label>
<label>客戶 *
<input id="client" class="field" required>
</label>
<label>類別
<select id="category" class="field">
<option value="men">男士</option>
<option value="women">女士</option>
</select>
</label>
<label class="wide">服務項目 *
<input id="service" class="field" required>
</label>
<label class="wide">施作內容 *
<textarea id="design" class="field" required rows="3"></textarea>
</label>
<label>原價 NT$
<input id="originalAmount" class="field" type="number" min="0" required>
</label>
<label>折讓 NT$
<input id="reportDiscount" class="field" type="number" min="0" required>
</label>
<label>其他加收 NT$
<input id="reportCharge" class="field" type="number" min="0" required>
</label>
<label>實際成交／實收 NT$ *
<input id="amount" class="field" type="number" min="0" required>
</label>
<label>付款方式
<select id="payment" class="field">
<option>現金</option>
<option>轉帳</option>
<option>信用卡</option>
<option>LINE Pay</option>
<option>其他</option>
</select>
</label>
<label>收款狀態
<select id="status" class="field">
<option>已結帳</option>
<option>待結帳</option>
</select>
</label>
<label class="wide">備註
<textarea id="reportNote" class="field" rows="2"></textarea>
</label>
</div>
<div class="actions">
<button class="action" id="save" type="submit">儲存回報</button>
<button class="action alt" id="resetReport" type="button">清空表單</button>
</div>
<p id="notice" class="micro"></p>
</form>
</div>
</section>

<section id="historyPage" class="hidden">
<div class="card">
<h2>業績紀錄與統計</h2>
<div class="twocol">
<label>月份
<input id="month" type="month" class="field">
</label>
<label>單日（可留空）
<input id="day" type="date" class="field">
</label>
<label>性別服務
<select id="filterGender" class="field">
<option value="all">全部</option>
<option value="men">男士</option>
<option value="women">女士</option>
</select>
</label>
<label>美甲師（可留空）
<input id="filterArtist" class="field" placeholder="輸入姓名">
</label>
</div>
<div class="statgrid">
<div class="stat"><div class="micro">回報筆數</div><strong id="count">0</strong></div>
<div class="stat"><div class="micro">已收款</div><strong id="paid">$0</strong></div>
<div class="stat"><div class="micro">待收款</div><strong id="due">$0</strong></div>
</div>
<div class="actions" style="margin-top:14px">
<button class="action" id="csv">匯出 CSV</button>
<button class="action alt" id="backup">備份 JSON</button>
<button class="action alt" id="restore">匯入備份</button>
<input id="restoreInput" type="file" accept=".json,application/json" class="hidden">
</div>
<div id="artistStats" class="micro" style="margin:14px 0"></div>
<div id="records"></div>
</div>
</section>

<div class="overlay hidden" id="modal">
<div class="dialog">
<div class="row">
<h2 id="modalTitle">明細</h2>
<button class="action alt" id="close">關閉</button>
</div>
<div id="modalBody"></div>
</div>
</div>
</div>
<div id="print" class="hidden"></div>

<script>
(()=>{
'use strict';

const $=id=>document.getElementById(id);
const fmt=n=>'$'+Math.round(Number(n)||0).toLocaleString('zh-TW');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({
'&':'&amp;','<':'&lt;','>':'&gt;',
'"':'&quot;',"'":'&#39;'
}[c]));
const day=()=>{
const d=new Date;
return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')
};

const styles=[
['clean','極簡日常',0,['line','matte']],
['graphic','潮流圖騰',0,['graphic','fire']],
['dark','暗黑金屬',100,['liquid','mirror1']],
['fandom','應援甲',200,['logo','letters']]
];

const menBases=[
['partial','局部造型',0,'partial'],
['solid','單色凝膠',800,'gel'],
['cat','貓眼凝膠',1000,'gel'],
['mirror','鏡面凝膠',1200,'gel'],
['french','法式凝膠',1300,'gel'],
['care','手部基礎保養',400,'care']
];

const womenBases=[
['wsh','單色光療 (手)',800,'gel'],
['wsf','單色光療 (足)',900,'gel'],
['wch','貓眼光療 (手)',1000,'gel'],
['wcf','貓眼光療 (足)',1100,'gel'],
['wmh','鏡面光療 (手)',1100,'gel'],
['wmf','鏡面光療 (足)',1200,'gel'],
['wfh','法式光療 (手)',1300,'gel'],
['wff','法式光療 (足)',1400,'gel'],
['whc','手部基礎保養',400,'care'],
['wfc','足部基礎保養',600,'care']
];

const menGroups=[
['色彩質感',[
['jump','跳色',50],
['matte','霧面處理',50],
['blend','漸層暈染',80]
]],
['極簡圖騰',[
['line','極簡線條',80],
['geometry','幾何拼色',100],
['graphic','街頭塗鴉',120],
['fire','火焰／閃電',120],
['cross','十字架圖騰',100]
]],
['金屬光感',[
['cat1','局部貓眼',50],
['mirror1','局部鏡面粉',70],
['liquid','液態金屬',150]
]],
['客製應援',[
['letters','字母／數字',100],
['sticker','客製貼紙',80],
['logo','應援 Logo',250],
['custom','精細圖案',350]
]],
['立體配件',[
['gem','鑽飾',10,'顆'],
['stud','金屬飾品',50,'件'],
['sculpt','3D 浮雕',200]
]]
];

const womenGroups=[
['造型加購',[
['w-jump','跳色',50],
['w-blend','暈染',80],
['w-extend','甲片延甲',100],
['w-french','法式(單指)',80],
['w-mirror','鏡面粉(單指)',70],
['w-cat','貓眼造型(單指)',50],
['w-gem','鑽(單顆)',10,'顆'],
['w-decor','鑽飾／飾品',50,'件']
]],
['深層保養',[
['w-handdeep','手部深層保養',600,'次'],
['w-footdeep','足部深層保養',1300,'次']
]]
];

const menExtra=[
['mextend','甲片延長',100],
['mrepair','單指修補',100],
['mdeep','手部深層保養',600,'次'],
['mrgem','卸大鑽',50,'顆'],
['mrext','卸延長甲',100]
];

const womenExtra=[
['w-rgem','卸大型鑽飾',50,'顆'],
['w-rext','卸延長甲',100]
];

const menu={men:menGroups,women:womenGroups};
const extras={men:menExtra,women:womenExtra};
const bases={men:menBases,women:womenBases};

const initial=g=>({
base:g==='men'?'solid':'wsh',
style:'clean',
q:{},
extra:{},
rem:'none',
discount:0,
charge:0,
fixed:'',
customer:'',
note:'',
fingers:{},
temp:{}
});

const state={
men:initial('men'),
women:initial('women')
};

let gender='men';
let records=[];
let editId=null;
let activeFinger=null;

const prices={};

try{
Object.assign(prices,JSON.parse(localStorage.getItem('xiang-prices-v8')||'{}'))
}catch(e){}

try{
records=JSON.parse(localStorage.getItem('xiang-reports-v8')||'[]');
if(!Array.isArray(records))records=[]
}catch(e){records=[]}

const s=()=>state[gender];
const data=()=>bases[gender].find(x=>x[0]===s().base);
const st=()=>styles.find(x=>x[0]===s().style);
const p=(key,base)=>s().temp[key]??prices[key]??base;

const adjust=(obj,key,delta,max=10)=>
obj[key]=Math.max(0,Math.min(max,(obj[key]||0)+delta));

function usePage(page){
['quote','report','history'].forEach(k=>
$(k+'Page').classList.toggle('hidden',k!==page));
document.querySelectorAll('[data-page]').forEach(b=>
b.classList.toggle('on',b.dataset.page===page));
if(page==='history')renderHistory()
}

function type(){
return data()[3]
}

function validAdd(id){
return type()!=='care'&&
!(gender==='men'&&(
(s().base==='cat'&&id==='cat1')||
(s().base==='mirror'&&id==='mirror1')
))
}

function baseFee(){
const b=data();
return p(gender+':base:'+b[0],b[2])+
(gender==='men'&&type()!=='care'?st()[2]:0)
}

function removalFee(){
return s().rem==='none'
?0
:p(gender+':rem:'+s().rem,s().rem==='continue'?200:400)
}

function qitems(arr,counts,kind){
return arr.flatMap(row=>{
let n=counts[row[0]]||0;
if(!n||(kind==='add'&&!validAdd(row[0])))return[];

let cost=p(gender+':'+kind+':'+row[0],row[2]);

let fingers=kind==='add'&&gender==='men'
?(s().fingers[row[0]]||[]).slice(0,n)
:[];

let fingerText=fingers.length
?'（'+fingers.map(x=>
(x[0]==='L'?'左':'右')+
['拇指','食指','中指','無名指','小指'][Number(x[1])]
).join('、')+'）'
:'';

return [{
name:row[1]+' × '+n+' '+(row[3]||'指')+fingerText,
value:n*cost
}]
})
}

function lines(){
let rows=[{name:data()[1],value:baseFee()}];

if(type()!=='care')
menu[gender].forEach(g=>
rows.push(...qitems(g[1],s().q,'add')));

if(s().rem!=='none')
rows.push({
name:s().rem==='continue'?'卸甲續作':'卸甲不續作',
value:removalFee()
});

rows.push(...qitems(
extras[gender].filter(x=>
s().rem!=='none'||
!x[0].includes('rgem')&&!x[0].includes('rext')
),
s().extra,
'extra'
));

if(gender==='women'){
let care=s().q['w-handdeep']||s().q['w-footdeep'];

if(care&&type()==='gel')
rows.push({name:'光療＋保養優惠',value:-200});
else if(care&&s().rem==='stop')
rows.push({name:'卸甲＋保養優惠',value:-100});
}else if(s().extra.mdeep){
if(type()==='gel')
rows.push({name:'凝膠＋保養優惠',value:-200});
else if(s().rem==='stop')
rows.push({name:'卸甲＋保養優惠',value:-100})
}

return rows
}

function subtotal(){
return Math.max(0,lines().reduce((a,x)=>a+x.value,0))
}

function finalPrice(){
let v=subtotal()
-Number(s().discount||0)
+Number(s().charge||0);

return s().fixed!==''
?Math.max(0,Number(s().fixed))
:Math.max(0,v)
}

function adjustedDiscount(){
return Math.max(
0,
subtotal()+Number(s().charge||0)-finalPrice()
)
}

function quoteLines(){
let a=lines().slice();

let df=adjustedDiscount();
if(df)a.push({name:'優惠折讓',value:-df});

let diff=finalPrice()-
(subtotal()+Number(s().charge||0)-df);

let ch=Number(s().charge||0)+diff;

if(ch)a.push({name:'其他調整',value:ch});

return a
}

function quantityRow(a,kind){
const n=(kind==='add'?s().q:s().extra)[a[0]]||0;
let unit=p(gender+':'+kind+':'+a[0],a[2]);
let isFinger=(a[3]||'指')==='指';

return `
<div class="item">
<div class="itemtext">
<div class="itemname">${esc(a[1])}</div>
<div class="muted">${fmt(unit)}／${a[3]||'指'}</div>
<button class="edit" data-editprice="${kind}|${a[0]}">✎ 修改單價</button>
${gender==='men'&&isFinger&&n&&kind==='add'
?`<button class="edit" data-finger="${a[0]}">・指定指位</button>`
:''}
</div>
<div class="count">
<button data-step="${kind}|${a[0]}|-1" ${!n?'disabled':''}>−</button>
<span>${n}</span>
<button data-step="${kind}|${a[0]}|1" ${n>=(isFinger?10:30)?'disabled':''}>＋</button>
</div>
</div>`
}

function render(){
document.body.classList.toggle('women',gender==='women');
$('menBtn').classList.toggle('on',gender==='men');
$('womenBtn').classList.toggle('on',gender==='women');
$('styleCard').classList.toggle('hidden',gender==='women');

$('styles').innerHTML=styles.map(a=>`
<button class="btnsel ${a[0]===s().style?'on':''}" data-style="${a[0]}">
${a[1]}
<small>${a[0]==='fandom'?'CUSTOM':'STYLE'}</small>
</button>
`).join('');

$('bases').innerHTML=bases[gender].map(a=>`
<div>
<button style="width:100%" class="btnsel ${a[0]===s().base?'on':''}" data-base="${a[0]}">
<b>${a[1]}</b>
<small>${fmt(p(gender+':base:'+a[0],a[2])+(gender==='men'&&a[3]!=='care'?st()[2]:0))}</small>
</button>
<button class="edit" data-editprice="base|${a[0]}">✎ 修改底價</button>
</div>
`).join('');

$('baseNote').textContent=
gender==='men'&&s().base==='partial'
?'局部造型尚未設定最低施工費。'
:'';

$('reclabel').textContent=
gender==='men'
?'依風格推薦，可自由加購單指至十指。'
:'保留原有女士加購與保養項目。';

$('recs').innerHTML=
gender==='men'
?st()[3].map(id=>{
let a=menGroups.flatMap(g=>g[1]).find(x=>x[0]===id);
return `<button class="action alt" data-quick="${id}">＋ ${a[1]}</button>`
}).join('')
:'';

const opened=new Set(
[...$('addons').querySelectorAll('details[open]')]
.map(x=>x.dataset.group)
);

$('addons').innerHTML=menu[gender].map((g,i)=>`
<details class="group" data-group="${i}"
${opened.has(String(i))||(!$('addons').children.length&&i===0)?'open':''}>
<summary>${g[0]}</summary>
${g[1].map(a=>
validAdd(a[0])
?quantityRow(a,'add')
:`<div class="item muted">${a[1]}已含在底款或不適用</div>`
).join('')}
</details>
`).join('');

$('removalChoices').innerHTML=[
['none','不卸甲',0],
['continue','卸甲續作',200],
['stop','卸甲不續作',400]
].map(a=>`
<div>
<button style="width:100%" class="btnsel ${s().rem===a[0]?'on':''}" data-rem="${a[0]}">
${a[1]}
<small>${fmt(a[0]==='none'?0:p(gender+':rem:'+a[0],a[2]))}</small>
</button>
${a[0]!=='none'
?`<button class="edit" data-editprice="rem|${a[0]}">✎ 修改價格</button>`
:''}
</div>
`).join('');

$('extras').innerHTML=extras[gender].filter(a=>
s().rem!=='none'||
(!a[0].includes('rgem')&&!a[0].includes('rext'))
).map(a=>quantityRow(a,'extra')).join('');

$('discount').value=s().discount||'';
$('extraCharge').value=s().charge||'';
$('fixedTotal').value=s().fixed;
$('customer').value=s().customer;
$('quoteNote').value=s().note;

$('total').textContent=finalPrice().toLocaleString('zh-TW');

$('adjustInfo').textContent=
'施作小計 '+fmt(subtotal())+
'・折讓 '+fmt(adjustedDiscount())+
'・成交 '+fmt(finalPrice())
}

function modifyPrice(kind,id){
let a=(
kind==='base'
?bases[gender]
:kind==='rem'
?[['continue','卸甲續作',200],['stop','卸甲不續作',400]]
:kind==='extra'
?extras[gender]
:menu[gender].flatMap(g=>g[1])
).find(x=>x[0]===id);

if(!a)return;

let key=gender+':'+kind+':'+id;
let old=p(key,a[2]);

let input=prompt(
'修改「'+a[1]+'」單價（目前 '+old+' 元）',
old
);

if(input===null)return;

let n=Number(input);

if(!Number.isFinite(n)||n<0||!Number.isInteger(n)){
alert('請輸入正確的非負整數');
return
}

let save=confirm(
'按「確定」：儲存為這台手機的預設單價\n按「取消」：只修改這筆報價'
);

if(save){
prices[key]=n;
delete s().temp[key];

try{
localStorage.setItem('xiang-prices-v8',JSON.stringify(prices))
}catch(e){
alert('預設單價無法持久儲存，請確認瀏覽器設定')
}
}else{
s().temp[key]=n
}

render()
}

function showModal(title,html){
$('modalTitle').textContent=title;
$('modalBody').innerHTML=html;
$('modal').classList.remove('hidden')
}

function quoteText(){
let name=s().customer
?'客人：'+s().customer+'\n'
:'';

return '香香村美妍製造所\n'+
(gender==='men'?'男士':'女士')+
'美甲估價單\n'+name+
quoteLines().map(x=>
x.name+'　'+(x.value<0?'-':'')+fmt(Math.abs(x.value))
).join('\n')+
'\n總金額：NT'+fmt(finalPrice())+
(s().note?'\n施工備註：'+s().note:'')+
'\n預估報價，以現場確認為準。\nLINE：@lry8774x'
}

function preview(){
let rows=quoteLines();

showModal('客人施作明細',`
<div class="receipt">
<b>XIANG BEAUTY STUDIO</b>
<p>${gender==='men'?'男士':'女士'}美甲報價</p>
${rows.map(x=>`
<div class="line">
<span>${esc(x.name)}</span>
<b>${x.value<0?'-':''}${fmt(Math.abs(x.value))}</b>
</div>
`).join('')}
<div class="row" style="padding-top:17px">
<b>合計</b>
<b style="font-size:21px">NT${fmt(finalPrice())}</b>
</div>
${s().note?`<p>${esc(s().note)}</p>`:''}
</div>
<div class="actions">
<button class="action" id="copy">複製報價</button>
<button class="action alt" id="printBtn">列印／PDF</button>
</div>
<textarea id="copyFallback" class="field hidden" rows="8"></textarea>
<p id="copyStatus" class="micro"></p>
`)
}

function fingerModal(id){
activeFinger=id;

let count=s().q[id]||0;
let vals=new Set((s().fingers[id]||[]).slice(0,count));

function body(){
return `
<p class="micro">最多指定 ${count} 指，亦可留空。</p>
${['L','R'].map(side=>`
<p>${side==='L'?'左手':'右手'}</p>
<div class="fingers">
${['拇指','食指','中指','無名指','小指'].map((nm,i)=>`
<button data-pos="${side+i}" class="${vals.has(side+i)?'on':''}">
${nm}
</button>
`).join('')}
</div>
`).join('')}
<button class="action" id="fingerDone">完成設定</button>`
}

showModal('施工指位',body());

$('modalBody').onclick=e=>{
let b=e.target.closest('button');
if(!b)return;

if(b.dataset.pos){
let v=b.dataset.pos;

if(vals.has(v))vals.delete(v);
else if(vals.size<count)vals.add(v);

$('modalBody').innerHTML=body()
}

if(b.id==='fingerDone'){
s().fingers[id]=[...vals];
$('modal').classList.add('hidden');
render()
}
}
}

function updateInputs(){
s().discount=Math.max(0,Number($('discount').value)||0);
s().charge=Math.max(0,Number($('extraCharge').value)||0);
s().fixed=$('fixedTotal').value;
s().customer=$('customer').value;
s().note=$('quoteNote').value;

$('total').textContent=finalPrice().toLocaleString('zh-TW');
$('adjustInfo').textContent=
'施作小計 '+fmt(subtotal())+
'・折讓 '+fmt(adjustedDiscount())+
'・成交 '+fmt(finalPrice())
}

function transfer(){
const r=quoteLines();

$('category').value=gender;
$('client').value=s().customer;

$('service').value=data()[1]+(
s().rem==='none'
?''
:'、'+(s().rem==='continue'?'卸甲續作':'卸甲不續作')
);

$('design').value=r.filter(x=>x.value>0)
.map(x=>x.name)
.join('；')+
(s().note?'；'+s().note:'');

$('originalAmount').value=subtotal();
$('reportDiscount').value=adjustedDiscount();
$('reportCharge').value=Number(s().charge||0);
$('amount').value=finalPrice();
$('reportNote').value=s().note;

$('notice').textContent=
'已帶入；請依實際施作與實收金額確認。'
}

function resetReport(){
editId=null;
$('reportForm').reset();
$('date').value=day();
$('save').textContent='儲存回報'
}

function persistRecords(){
try{
localStorage.setItem('xiang-reports-v8',JSON.stringify(records));
return true
}catch(e){
alert('儲存失敗，請匯出備份。');
return false
}
}

function filtered(){
return records.filter(r=>
(!$('month').value||r.date.startsWith($('month').value))&&
(!$('day').value||r.date===$('day').value)&&
($('filterGender').value==='all'||r.gender===$('filterGender').value)&&
(!$('filterArtist').value||r.artist.includes($('filterArtist').value.trim()))
)
}

function renderHistory(){
let rec=filtered();

let paid=rec.filter(r=>r.status==='已結帳')
.reduce((sum,r)=>sum+Number(r.amount),0);

let due=rec.filter(r=>r.status==='待結帳')
.reduce((sum,r)=>sum+Number(r.amount),0);

$('count').textContent=rec.length;
$('paid').textContent=fmt(paid);
$('due').textContent=fmt(due);

let by={};

rec.filter(r=>r.status==='已結帳').forEach(r=>
by[r.artist]=(by[r.artist]||0)+Number(r.amount)
);

$('artistStats').textContent=
'美甲師已收：'+(
Object.entries(by).map(([k,v])=>k+' '+fmt(v)).join('／')||
'尚無紀錄'
);

$('records').innerHTML=rec.length
?rec.map(r=>`
<div class="reportrow">
<div class="row">
<b>${esc(r.date)}・${esc(r.artist)}</b>
<b>${fmt(r.amount)}</b>
</div>
<p class="muted">
${esc(r.gender==='men'?'男士':'女士')}｜
${esc(r.client)}｜
${esc(r.payment)}｜
${esc(r.status)}
</p>
<div>${esc(r.service)}</div>
<p class="micro">${esc(r.design)}</p>
<p class="micro">
原價 ${fmt(r.original||r.amount)}／
折讓 ${fmt(r.discount||0)}／
加收 ${fmt(r.charge||0)}
</p>
<div class="actions">
<button class="action alt" data-editrec="${r.id}">編輯</button>
<button class="action danger" data-delrec="${r.id}">刪除</button>
</div>
</div>
`).join('')
:'<p class="micro">目前沒有符合條件的紀錄。</p>'
}

function download(name,data,mime){
let url=URL.createObjectURL(new Blob([data],{type:mime}));
let a=document.createElement('a');

a.href=url;
a.download=name;

document.body.appendChild(a);
a.click();
a.remove();

setTimeout(()=>URL.revokeObjectURL(url),2000)
}

function exportCSV(){
let header=[
'日期','美甲師','類別','客戶','服務','內容',
'原價','折讓','加收','成交','支付','狀態','備註'
];

let rows=[
header,
...filtered().map(r=>[
r.date,r.artist,r.gender==='men'?'男士':'女士',
r.client,r.service,r.design,
r.original,r.discount,r.charge,r.amount,
r.payment,r.status,r.note
])
];

const cell=v=>{
let x=String(v??'');

if(/^[=+@\-]/.test(x))x="'"+x;

return '"'+x.replace(/"/g,'""')+'"'
};

download(
'香香村_美甲師業績.csv',
'\ufeff'+rows.map(row=>row.map(cell).join(',')).join('\r\n'),
'text/csv;charset=utf-8'
)
}

document.addEventListener('click',async e=>{
const b=e.target.closest('button');
if(!b)return;

if(b.dataset.page){
usePage(b.dataset.page)
}
else if(b.dataset.gender){
updateInputs();
gender=b.dataset.gender;
render()
}
else if(b.dataset.style){
s().style=b.dataset.style;
render()
}
else if(b.dataset.base){
s().base=b.dataset.base;
if(type()==='care')s().q={};
render()
}
else if(b.dataset.rem){
s().rem=b.dataset.rem;
render()
}
else if(b.dataset.quick){
adjust(s().q,b.dataset.quick,1);
render()
}
else if(b.dataset.step){
let[k,id,delta]=b.dataset.step.split('|');

let list=k==='add'
?menu[gender].flatMap(g=>g[1])
:extras[gender];

let a=list.find(v=>v[0]===id);

adjust(
k==='add'?s().q:s().extra,
id,
Number(delta),
(a[3]||'指')==='指'?10:30
);

if(k==='add')
s().fingers[id]=(s().fingers[id]||[]).slice(0,s().q[id]);

render()
}
else if(b.dataset.editprice){
let[k,id]=b.dataset.editprice.split('|');
modifyPrice(k,id)
}
else if(b.dataset.finger){
fingerModal(b.dataset.finger)
}
else if(b.id==='preview'){
preview()
}
else if(b.id==='clearQuote'){
state[gender]=initial(gender);
render()
}
else if(b.id==='transfer'){
updateInputs();
transfer();
usePage('report')
}
else if(b.id==='import'){
updateInputs();
transfer()
}
else if(b.id==='close'){
$('modal').classList.add('hidden');
$('modalBody').onclick=null
}
else if(b.id==='copy'){
try{
await navigator.clipboard.writeText(quoteText());
$('copyStatus').textContent='已複製，可貼入 LINE。'
}catch(_){
$('copyFallback').classList.remove('hidden');
$('copyFallback').value=quoteText();
$('copyFallback').select();
$('copyStatus').textContent='請長按文字複製。'
}
}
else if(b.id==='printBtn'){
$('print').innerHTML=`
<h1>香香村美妍製造所</h1>
<h2>美甲估價單</h2>
${quoteLines().map(x=>`
<div class="line">
<span>${esc(x.name)}</span>
<b>${fmt(x.value)}</b>
</div>
`).join('')}
<h2>總計 ${fmt(finalPrice())}</h2>
`;

window.print()
}
else if(b.id==='resetReport'){
resetReport()
}
else if(b.dataset.editrec){
let r=records.find(x=>x.id===b.dataset.editrec);
if(!r)return;

editId=r.id;

for(let [key,id] of Object.entries({
date:'date',
artist:'artist',
client:'client',
gender:'category',
service:'service',
design:'design',
original:'originalAmount',
discount:'reportDiscount',
charge:'reportCharge',
amount:'amount',
payment:'payment',
status:'status',
note:'reportNote'
})){
$(id).value=r[key]??''
}

$('save').textContent='更新回報';
usePage('report')
}
else if(b.dataset.delrec){
if(confirm('確定刪除此筆回報？')){
records=records.filter(x=>x.id!==b.dataset.delrec);
persistRecords();
renderHistory()
}
}
else if(b.id==='csv'){
exportCSV()
}
else if(b.id==='backup'){
download(
'香香村_紀錄備份.json',
JSON.stringify({records,prices},null,2),
'application/json'
)
}
else if(b.id==='restore'){
$('restoreInput').click()
}
});

[
'discount','extraCharge','fixedTotal','customer','quoteNote'
].forEach(id=>$(id).addEventListener('input',updateInputs));

$('reportForm').addEventListener('submit',e=>{
e.preventDefault();

if(!$('reportForm').reportValidity())return;

let r={
date:$('date').value,
artist:$('artist').value.trim(),
client:$('client').value.trim(),
gender:$('category').value,
service:$('service').value.trim(),
design:$('design').value.trim(),
original:Number($('originalAmount').value),
discount:Number($('reportDiscount').value),
charge:Number($('reportCharge').value),
amount:Number($('amount').value),
payment:$('payment').value,
status:$('status').value,
note:$('reportNote').value
};

if([r.original,r.discount,r.charge,r.amount]
.some(v=>!Number.isFinite(v)||v<0)){
alert('金額需為非負數');
return
}

if(editId){
let idx=records.findIndex(x=>x.id===editId);
if(idx>=0)records[idx]={...r,id:editId}
}else{
records.unshift({
...r,
id:'R'+Date.now()+Math.random().toString(36).slice(2,7)
})
}

if(persistRecords()){
resetReport();
usePage('history')
}
});

[
'month','day','filterGender','filterArtist'
].forEach(id=>$(id).addEventListener('input',renderHistory));

$('restoreInput').addEventListener('change',async e=>{
let f=e.target.files[0];
if(!f)return;

try{
let v=JSON.parse(await f.text());

if(!Array.isArray(v.records)||
!confirm('確定合併備份中的紀錄？'))return;

let m=new Map(records.map(r=>[r.id,r]));

v.records.forEach(r=>{
if(r.id&&r.date&&r.artist)m.set(r.id,r)
});

records=[...m.values()];

if(v.prices&&typeof v.prices==='object')
Object.assign(prices,v.prices);

persistRecords();

localStorage.setItem('xiang-prices-v8',JSON.stringify(prices));

renderHistory();
alert('備份匯入完成')
}catch(err){
alert('備份格式無法辨識')
}

e.target.value=''
});

$('modal').addEventListener('click',e=>{
if(e.target===$('modal'))
$('modal').classList.add('hidden')
});

$('date').value=day();
$('month').value=day().slice(0,7);

render();

})();
</script>
</body>
