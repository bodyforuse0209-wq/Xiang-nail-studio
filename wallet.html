<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f8f5ef"><title>香香村 V13｜會員錢包</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Noto Sans TC',sans-serif;color:#372e2a;background:#faf8f5}*{box-sizing:border-box}body{margin:0}header{padding:24px 18px;background:linear-gradient(120deg,#fffefa,#ede3d5)}main,.wrap{max-width:760px;margin:auto;padding:16px}h1{font-size:25px;margin:8px 0}h2{font-size:18px;margin:0 0 12px}.tag{font-size:12px;letter-spacing:.16em;color:#92795b}.card{background:#fff;border:1px solid #e8e0d7;border-radius:17px;padding:18px;margin:12px 0;box-shadow:0 3px 12px #6c52300a}label{display:block;font-size:13px;margin:14px 0 6px}input,select{width:100%;padding:13px;border:1px solid #d9cec2;border-radius:10px;background:white;font-size:16px}button{padding:13px 16px;background:#40352f;color:white;border:0;border-radius:10px;font-size:15px;cursor:pointer}.light{background:#e9dfd2;color:#40352f}.muted{color:#84766d;font-size:13px}.money{font-size:22px;font-weight:700;line-height:1.5}.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-family:inherit;font-size:13px;line-height:1.8}.warning{padding:13px;border:1px solid #d8bda1;border-radius:12px;background:#fff9ef;color:#785337;font-size:13px}a{color:#725940}#status{font-size:13px;white-space:pre-wrap}
</style></head><body><header><div class="wrap"><div class="tag">XIANG BEAUTY STUDIO · V13 PREVIEW</div><h1>香香村｜會員錢包</h1><a href="./customers.html">← 返回客戶管理 V12</a></div></header>
<div class="wrap"><p id="status">載入中…</p><section id="auth" class="card"><h2>員工登入</h2><label>電子郵件</label><input id="email" type="email" autocomplete="username"><label>密碼</label><input id="password" type="password" autocomplete="current-password"><p><button id="login">登入</button></p></section>
<main id="main" hidden><div class="warning"><strong>安全預覽版：</strong>目前不提供真實儲值、消費扣款或退款。請勿將模擬結果當作正式交易。</div><section class="card"><div class="row"><h2>會員查詢</h2><span id="role" class="muted"></span></div><label>選擇客戶</label><select id="customer"><option value="">選擇客戶</option></select><p id="who" class="muted">請選擇客戶</p><div class="muted">目前錢包總餘額</div><div class="money" id="balance">尚未讀取</div><p><button id="copy" class="light">複製 LINE 餘額通知</button></p></section>
<section class="card"><h2>扣款試算｜先扣贈送金</h2><div class="row"><div><label>本金餘額（唯讀資料來源）</label><input id="principal" type="number" value="0" readonly></div><div><label>贈送金餘額（唯讀資料來源）</label><input id="bonus" type="number" value="0" readonly></div></div><label>模擬消費金額（NT$）</label><input id="amount" type="number" min="1" step="1" placeholder="例如：800"><p id="simulation" class="warning">請輸入模擬消費金額</p><button disabled title="完成安全規則測試後才開放">正式扣款（尚未啟用）</button></section>
<section class="card"><h2>最近 30 筆錢包交易</h2><pre id="transactions">請先選擇客戶</pre><p class="muted">此頁僅讀取 wallets/{customerId}/transactions，沒有任何寫入功能。</p></section><button id="logout" class="light">登出</button></main></div>
<script src="./firebase-config.js"></script><script type="module" src="./wallet.js"></script></body></html>
